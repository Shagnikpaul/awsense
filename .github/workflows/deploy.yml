name: Deploy AWSense
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # -------------------------
      # FRONTEND BUILD
      # -------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist


      # txt files generation + faiss index generation
      - name: Setup Python (for vector build)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install vector build dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install sentence-transformers faiss-cpu numpy beautifulsoup4 requests 


      - name: Generate AWS docs dataset
        run: |
          python scripts/awsdocs_collector_metadata_generator.py

      - name: Build FAISS vector store
        run: |
          python scripts/build_vector_store.py

      # -------------------------
      # BACKEND PACKAGE
      # -------------------------

      - name: Create Lambda package
        working-directory: backend
        run: |
          zip -r lambda.zip src/ requirements.txt vector_store/

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v7
        with:
          name: lambda-package
          path: backend/lambda.zip

  integration-test:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run integration tests
        working-directory: backend
        run: |
          pytest tests/integration -v
  
  deploy:
    needs: [integration-test]
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6